<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BatchTrack Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f5f1e8;
        --panel: #fffdf8;
        --panel-alt: #eef3e9;
        --ink: #17251f;
        --muted: #657169;
        --line: #d9ded2;
        --brand: #e56b38;
        --brand-2: #173d35;
        --success: #2f8059;
        --warning: #c88a18;
        --danger: #c64c42;
        --shadow: 0 18px 45px rgba(31, 48, 38, 0.09);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); }
      body { min-height: 100vh; }
      button, input, select, textarea { font: inherit; }
      .app-shell { width: min(1320px, calc(100% - 44px)); margin: 0 auto; padding: 26px 0 56px; }
      .nav { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 15px 20px; background: rgba(255,253,248,0.9); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 30px rgba(31, 48, 38, 0.06); position: sticky; top: 14px; z-index: 10; backdrop-filter: blur(12px); }
      .brand { display: flex; align-items: center; gap: 11px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; }
      .brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--brand-2); display: grid; place-items: center; color: #f5d65c; font-weight: 900; }
      .nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .nav-links a, .nav-links button { color: var(--muted); text-decoration: none; background: none; border: 0; cursor: pointer; font-weight: 600; }
      .nav-links a:hover, .nav-links button:hover { color: var(--brand-2); }
      .nav-links .nav-action { padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-size: 12px; }
      .nav-links .nav-action.primary { background: var(--brand-2); color: #fffdf8; border-color: var(--brand-2); }
      .mode-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: #f0ede4; color: var(--brand-2); cursor: pointer; font-size: 12px; font-weight: 700; }
      .mode-toggle::before { content: none; }
      .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 700; transition: 0.18s ease; }
      .btn:hover { transform: translateY(-1px); }
      .btn.primary { background: var(--brand-2); color: #fffdf8; border-color: transparent; }
      .btn.success { background: rgba(10, 143, 93, 0.1); color: var(--success); border-color: rgba(10,143,93,0.2); }
      .btn.warn { background: rgba(234,179,8,0.12); color: #8a6500; border-color: rgba(234,179,8,0.35); }
      .btn.danger { background: rgba(217,60,75,0.08); color: var(--danger); border-color: rgba(217,60,75,0.2); }
      .grid { display: grid; }
      .hero { display: grid; grid-template-columns: 1.12fr 0.88fr; gap: 20px; margin-top: 28px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); }
      .hero-copy { padding: 48px 42px; background: radial-gradient(circle at 86% 12%, #f5d65c 0, #f5d65c 4px, transparent 5px), var(--panel); }
      .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; background: #f6e8c7; border: 1px solid #e5c982; border-radius: 7px; color: #85551c; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; }
      h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.04em; }
      h1 { font-size: clamp(2.5rem, 5vw, 4.6rem); line-height: 0.98; margin: 20px 0 18px; max-width: 720px; }
      .sub { color: var(--muted); font-size: 1.05rem; line-height: 1.75; max-width: 620px; }
      .cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
      .stats { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 12px; margin-top: 26px; }
      .stat-box { background: var(--panel-alt); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
      .stat-box strong { font-size: 1.8rem; display: block; }
      .stat-box span { color: var(--muted); font-size: 12px; font-weight: 600; }
      .hero-visual { padding: 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 460px; background: var(--brand-2); color: #fffdf8; overflow: hidden; position: relative; }
      .hero-visual::before { content: ''; position: absolute; width: 260px; height: 260px; border: 1px solid rgba(245,214,92,0.35); border-radius: 50%; top: -90px; right: -70px; }
      .mini-card { border: 1px solid var(--line); background: rgba(255,255,255,0.8); border-radius: 20px; padding: 18px; }
      .hero-visual .mini-card { position: relative; border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); }
      .mini-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .product-box { display: flex; align-items: center; gap: 12px; }
      .thumb { width: 52px; height: 52px; border-radius: 12px; background: #f5d65c; display: grid; place-items: center; font-weight: 800; color: var(--brand-2); }
      .tag { display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 999px; background: rgba(10, 143, 93, 0.1); color: var(--success); font-size: 11px; font-weight: 800; }
      .layout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 30px; }
      .feature-block { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; border-top: 3px solid var(--brand); }
      .feature-block h3 { margin: 10px 0 14px; font-size: 1.2rem; }
      .feature-block ul { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.9; }
      .auth-shell { margin-top: 28px; background: var(--panel); border:1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
      .auth-intro { max-width: 680px; margin: 8px 0 24px; }
      .auth-intro h1 { font-size: clamp(2rem, 4vw, 3.4rem); margin: 0 0 10px; }
      .auth-intro p { color: var(--muted); line-height: 1.7; margin: 0; }
      .auth-switch { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
      .seg { flex: 1; min-width: 180px; border: 1px solid var(--line); background: #f7f4ec; border-radius: 9px; padding: 12px 18px; cursor: pointer; font-weight: 700; color: var(--muted); }
      .seg.active { background: var(--brand-2); color: #fffdf8; border-color: transparent; }
      .mode-switch { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 18px; background: #f0ede4; border-radius: 9px; }
      .mode-switch button { border: 0; border-radius: 6px; padding: 8px 12px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 700; font-size: 12px; }
      .mode-switch button.active { background: var(--panel); color: var(--brand-2); box-shadow: 0 2px 8px rgba(31,48,38,0.08); }
      .auth-grid { display: grid; grid-template-columns: 1.1fr 1.1fr; gap: 24px; }
      .card { background: #f7f4ec; border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
      .card h2 { margin: 0 0 16px; font-size: 1.4rem; }
      .field { display: grid; gap: 8px; margin-bottom: 14px; }
      .field label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; }
      .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 12px 14px; color: var(--ink); outline: none; }
      .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(229,107,56,0.14); }
      .field textarea { min-height: 90px; resize: vertical; }
      .two-col { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
      .hidden { display: none !important; }
      .dashboard { margin-top: 32px; display: grid; gap: 20px; }
      .summary { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
      .summary-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; position: relative; overflow: hidden; }
      .summary-card::after { content: ''; position: absolute; width: 54px; height: 4px; background: var(--brand); top: 0; left: 18px; }
      .summary-card .k { display: block; color: var(--muted); font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase; font-weight: 800; }
      .summary-card strong { display: block; margin-top: 10px; font-size: clamp(1.5rem, 2vw, 2.1rem); }
      .summary-card small { display: block; margin-top: 6px; color: var(--muted); }
      .workspace { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 20px; }
      .section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .section-head h3 { margin: 0; font-size: 1.15rem; }
      .list { display: grid; gap: 12px; }
      .row-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; background: #f7f4ec; border: 1px solid var(--line); border-radius: 9px; }
      .row-meta { display: flex; align-items: center; gap: 12px; }
      .avatar { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #dfeaff, #e7f8ef); display: grid; place-items: center; font-weight: 800; }
      .pill { display: inline-flex; padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; }
      .pill.green { background: rgba(10,143,93,0.08); color: var(--success); }
      .pill.blue { background: rgba(28,110,242,0.08); color: var(--brand); }
      .pill.red { background: rgba(217,60,75,0.08); color: var(--danger); }
      .table-wrap { overflow: auto; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
      th { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
      .tiny { font-size: 12px; color: var(--muted); }
      .schema-box { background: #f7f4ec; border:1px dashed #c8b57e; border-radius: 10px; padding: 14px; margin-top: 12px; }
      .schema-box strong { display: block; margin-bottom: 8px; }
      .schema-box code { background: white; padding: 8px 10px; border-radius: 10px; display: block; color: var(--brand-2); font-size: 12px; }
      .scanner-modal { position: fixed; inset: 0; background: rgba(11, 23, 38, 0.62); display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px; }
      .scanner-modal.active { display: flex; }
      .scanner-panel { width: min(560px, 100%); background: #fff; border-radius: 24px; border: 1px solid var(--line); box-shadow: var(--shadow); padding: 20px; }
      .setup-modal { position: fixed; inset: 0; background: rgba(23, 61, 53, 0.52); display: grid; place-items: center; z-index: 40; padding: 20px; }
      .setup-card { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 24px; }
      video { width: 100%; border-radius: 18px; background: black; aspect-ratio: 16/10; }
      .toast { position: fixed; right: 20px; bottom: 20px; background: rgba(18,32,51,0.92); color: white; border-radius: 12px; padding: 12px 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); opacity: 0; transform: translateY(12px); transition: 0.2s ease; pointer-events: none; z-index: 99; }
      .toast.show { opacity: 1; transform: translateY(0); }
      body.phone-mode { background: #ded8cc; }
      body.phone-mode .app-shell { width: min(420px, calc(100% - 24px)); padding: 14px 0 34px; }
      body.phone-mode .nav { top: 8px; padding: 12px; border-radius: 18px; gap: 12px; }
      body.phone-mode .nav-links { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      body.phone-mode .nav-links a { display: none; }
      body.phone-mode .nav-links .nav-action, body.phone-mode .mode-toggle { width: 100%; text-align: center; }
      body.phone-mode .mode-toggle { grid-column: 1 / -1; justify-content: center; }
      body.phone-mode .hero { grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
      body.phone-mode .hero-copy { padding: 28px 22px; border-radius: 20px; }
      body.phone-mode h1 { font-size: 2.45rem; }
      body.phone-mode .sub { font-size: 0.95rem; line-height: 1.6; }
      body.phone-mode .hero-visual { min-height: 360px; border-radius: 20px; }
      body.phone-mode .stats, body.phone-mode .layout, body.phone-mode .workspace, body.phone-mode .auth-grid { grid-template-columns: 1fr; gap: 12px; }
      body.phone-mode .layout { margin-top: 14px; }
      body.phone-mode .feature-block, body.phone-mode .section, body.phone-mode .auth-shell { padding: 18px; border-radius: 14px; }
      body.phone-mode .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      body.phone-mode .summary-card { padding: 13px; }
      body.phone-mode .summary-card strong { font-size: 1.35rem; }
      body.phone-mode .section-head { align-items: flex-start; flex-direction: column; }
      body.phone-mode .section-head .btn { width: 100%; }
      body.phone-mode .auth-intro h1 { font-size: 2.35rem; }
      body.phone-mode .auth-switch { display: grid; grid-template-columns: 1fr; gap: 7px; }
      body.phone-mode .seg { min-width: 0; }
      body.phone-mode .mode-switch { display: flex; width: 100%; }
      body.phone-mode .mode-switch button { flex: 1; }
      body.phone-mode .table-wrap { margin-right: -18px; }
      :focus-visible { outline: 3px solid rgba(229,107,56,0.45); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
      @media (max-width: 980px) {
        .hero, .workspace, .auth-grid { grid-template-columns: 1fr; }
        .summary { grid-template-columns: repeat(2, minmax(0,1fr)); }
      }
      @media (max-width: 680px) {
        .app-shell { width: min(100% - 18px, 1280px); }
        .nav { flex-direction: column; align-items: flex-start; }
        .summary { grid-template-columns: 1fr; }
        .two-col { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.0.0/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.5.1/dist/bwip-js-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // The anon key is designed for browser use; database access is enforced by Supabase RLS.
      window.BATCHTRACK_SUPABASE_CONFIG = {
        url: 'https://bwiytslmkiyzdaijjtka.supabase.co',
          anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJid2l5dHNsbWtpeXpkYWlqdGthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNDcxOTYsImV4cCI6MjEwNDYyMzE5Nn0.Rke5rXqI5bS9lRbwsW5lXLyCWe2qhWkY6-pCMZqbM6o'
      };
      window.batchTrackConfigReady = fetch('/api/config')
        .then((response) => response.ok ? response.json() : null)
        .then((config) => {
          if (config?.url && config?.anonKey) window.BATCHTRACK_SUPABASE_CONFIG = config;
          return window.BATCHTRACK_SUPABASE_CONFIG;
        })
        .catch(() => window.BATCHTRACK_SUPABASE_CONFIG);
    </script>
    <script src="./database/local-db.js"></script>
    <script type="module">
      window.zxingReady = import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm')
        .then((module) => { window.ZXingBrowser = module; return module; })
        .catch((error) => { console.error('ZXing failed to load:', error); return null; });
    </script>

    <script>
      (function () {
        const state = {
          role: 'retailer',
          session: null,
          authMode: 'signin',
          viewMode: localStorage.getItem('batchtrack_view_mode') || 'desktop',
          retailerPage: 'overview',
          retailer: null,
          consumer: null,
          machine: null,
          inventory: [],
          transactions: [],
          consumers: [],
          machines: [],
          documents: [],
          creditNotes: [],
          supportTickets: [],
          scanTarget: null,
          scannerActive: false,
          toastTimer: null
        };

        const appNode = document.getElementById('app');
        const toastNode = document.getElementById('toast');

        function showToast(message) {
          toastNode.textContent = message;
          toastNode.classList.add('show');
          clearTimeout(state.toastTimer);
          state.toastTimer = setTimeout(() => toastNode.classList.remove('show'), 2200);
        }

        function getSession() {
          try {
            return JSON.parse(localStorage.getItem('batchtrack_session') || 'null');
          } catch (err) {
            return null;
          }
        }

        function saveSession(session) {
          if (session) localStorage.setItem('batchtrack_session', JSON.stringify(session));
          else localStorage.removeItem('batchtrack_session');
        }

        function applyViewMode() {
          document.body.classList.toggle('phone-mode', state.viewMode === 'phone');
        }

        function modeControl() {
          return `<button class="mode-toggle" type="button" data-mode-toggle aria-label="Switch between desktop and phone mode"><span>${state.viewMode === 'phone' ? 'Desktop view' : 'Phone view'}</span></button>`;
        }

        function toggleViewMode() {
          state.viewMode = state.viewMode === 'phone' ? 'desktop' : 'phone';
          localStorage.setItem('batchtrack_view_mode', state.viewMode);
          applyViewMode();
          document.querySelectorAll('[data-mode-toggle] span').forEach((label) => {
            label.textContent = state.viewMode === 'phone' ? 'Desktop view' : 'Phone view';
          });
        }

        function uid() {
          if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
          return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
        }

        async function readTable(name) {
          return window.BatchTrackDB.read(name);
        }

        async function writeTable(name, value) {
          return window.BatchTrackDB.put(name, value);
        }

        async function deleteTableItem(name, id) {
          return window.BatchTrackDB.remove(name, id);
        }

        async function findByTable(name, predicate) {
          const list = await readTable(name);
          return list.find(predicate) || null;
        }

        async function loadAllData() {
          const [retailers, consumers, machines, inventory, transactions, documents, creditNotes, supportTickets] = await Promise.all([
            readTable('retailers'),
            readTable('consumers'),
            readTable('machines'),
            readTable('inventory'),
            readTable('transactions'),
            readTable('documents'),
            readTable('credit_notes'),
            readTable('support_tickets')
          ]);
          state.retailers = retailers;
          state.consumers = consumers;
          state.machines = machines;
          state.inventory = inventory;
          state.transactions = transactions;
          state.documents = documents;
          state.creditNotes = creditNotes;
          state.supportTickets = supportTickets;
        }

        const TRACKLY_CATEGORIES = ['pharma', 'consumables', 'electronics'];

        function normalizeCategory(value) {
          const normalized = String(value || '').trim().toLowerCase();
          if (normalized.includes('pharm') || normalized.includes('medic')) return 'pharma';
          if (normalized.includes('elect') || normalized.includes('gadget') || normalized.includes('device')) return 'electronics';
          if (normalized.includes('consum') || normalized.includes('food') || normalized.includes('grocery')) return 'consumables';
          return TRACKLY_CATEGORIES.includes(normalized) ? normalized : 'consumables';
        }

        function parseAztecPayload(text) {
          const parts = String(text || '').trim().split('|');
          if (parts[0] !== 'AZT' || parts.length < 7) return null;
          return {
            wadn: parts[1],
            category: normalizeCategory(parts[2]),
            batchNumber: parts[3],
            price: Number(parts[4]) || 0,
            expiry: parts[5],
            warrantyMonths: Number(parts[6]) || 0
          };
        }

        function warrantyExpiry(item, fromDate = new Date()) {
          const start = new Date(item.mfgDate || item.purchaseDate || fromDate);
          const months = Number(item.warrantyMonths || item.warranty || 0);
          if (!months || Number.isNaN(start.getTime())) return '';
          const expiry = new Date(start);
          expiry.setMonth(expiry.getMonth() + months);
          return expiry.toISOString().slice(0, 10);
        }

        function aztecPayload(item) {
          return ['AZT', item.wadn, normalizeCategory(item.category), item.batchNumber, Number(item.price || 0), item.expiry || '', Number(item.warrantyMonths || 0)].join('|');
        }

        function qrPayload(item) {
          return JSON.stringify({ wadn: item.wadn, batch: item.batchNumber, cat: normalizeCategory(item.category), exp: item.expiry || '' });
        }

        function renderLanding() {
          appNode.innerHTML = `
            <div class="app-shell">
              <nav class="nav">
                <div class="brand"><span class="brand-mark">B</span> BatchTrack Pro</div>
                <div class="nav-links">
                  ${modeControl()}
                  <a class="nav-action" href="/survey">Take survey</a>
                  <button class="nav-action" type="button" data-action="go-retailer-auth">Retailer login</button>
                  <button class="nav-action" type="button" data-action="go-signup">Create account</button>
                  <button class="nav-action primary" type="button" data-action="go-consumer-auth">Consumer login</button>
                </div>
              </nav>

              <section class="hero">
                <div class="panel hero-copy">
                  <div class="eyebrow">Supabase inventory + ownership ledger</div>
                  <h1>Track stock, rewards, and ownership in one system.</h1>
                  <p class="sub">BatchTrack Pro stores retailer, consumer, billing-machine, product, and survey records in Supabase. Every item can be traced, scanned, uploaded, and assigned a dual-code label.</p>
                  <div class="cta-row">

        function bindLandingEvents() {
          document.querySelectorAll('[data-role]').forEach((btn) => {

              document.querySelectorAll('[data-role]').forEach((item) => item.classList.toggle('active', item === btn));
              const signinRole = document.getElementById('signin-role');
              const signupRole = document.getElementById('signup-role');
              if (signinRole) signinRole.value = role;
              if (signupRole) signupRole.value = role;
            });
          });

          document.querySelectorAll('[data-action]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const action = btn.dataset.action;
              if (action === 'go-retailer-auth') state.role = 'retailer';
              if (action === 'go-consumer-auth') state.role = 'consumer';
              if (action === 'go-machine-auth') state.role = 'machine';
              if (action === 'go-retailer-auth' || action === 'go-consumer-auth') state.authMode = 'signin';
              if (action === 'go-signup') state.authMode = 'signup';
              renderAuth();
            });
          });

              saveSession(state.session);
              renderDashboard();
              return;

              state.session = null;
              saveSession(null);
              renderLanding();
              return;

            state.consumer = consumer;
            renderConsumerDashboard(consumer);
            return;

            saveSession(null);
            renderLanding();
            return;

        async function startQrScanner(onScan) {
          const modal = document.createElement('div');
          modal.className = 'scanner-modal active';
          modal.innerHTML = `
            <div class="scanner-panel">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 style="margin:0;">Scan QR or Aztec</h3>
                <button class="btn" type="button" data-close-scanner>Close</button>
              </div>
              <video id="scanner-video" autoplay playsinline muted></video>
              <div style="margin-top:12px; text-align:center; color:var(--muted); font-size:13px;">Point the camera at a BatchTrack QR or Aztec label.</div>
            </div>
          `;
          document.body.appendChild(modal);

          const video = modal.querySelector('#scanner-video');
          let stream = null;
          let controls = null;
          let closed = false;
          const close = () => {
            if (closed) return;
            closed = true;
            controls?.stop?.();
            stream?.getTracks().forEach((track) => track.stop());
            modal.remove();
          };
          modal.querySelector('[data-close-scanner]').addEventListener('click', close);
          const handleDecodedText = (text, format) => {
            if (closed || !text) return;
            const aztec = parseAztecPayload(text);
            if (aztec) {
              close();
              if (onScan) {
                onScan(aztec, text);
                return;
              }
              state.scanTarget = aztec.batchNumber;
              const batchInput = document.getElementById('machine-batch');
              if (batchInput) batchInput.value = aztec.batchNumber;
              showToast(`Aztec matched: ${aztec.wadn}`);
              return;
            }
            let payload;
            try {
              payload = JSON.parse(text);
            } catch (error) {
              payload = { batch: text.trim() };
            }
            if (!payload.batch) {
              showToast(`${format || 'Barcode'} does not contain a BatchTrack item.`);
              return;
            }
            state.scanTarget = payload.batch;
            if (onScan) {
              close();
              onScan({ wadn: payload.wadn || '', batchNumber: payload.batch, category: normalizeCategory(payload.cat), expiry: payload.exp || '', price: Number(payload.price || 0), warrantyMonths: Number(payload.warrantyMonths || 0) }, text);
              return;
            }
            const item = state.inventory.find((entry) => entry.batchNumber === payload.batch || entry.id === payload.batch);
            close();
            const batchInput = document.getElementById('machine-batch');
            if (batchInput) batchInput.value = payload.batch;
            showToast(item ? `${format || 'Code'} matched: ${item.batchNumber}` : 'Code read, but no Supabase inventory item matched it.');
          };

          try {
            const zxing = await (window.zxingReady || Promise.resolve(window.ZXingBrowser));
            if (zxing?.BrowserMultiFormatReader) {
              const reader = new zxing.BrowserMultiFormatReader();
              controls = await reader.decodeFromVideoDevice(undefined, video, (result, error) => {
                if (result) handleDecodedText(result.getText(), result.getBarcodeFormat?.());
              });
              return;
            }
            throw new Error('Multi-format scanner library did not load.');
          } catch (error) {
            try {
              stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
              video.srcObject = stream;
              await video.play();
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d', { willReadFrequently: true });
              const tick = () => {
                if (closed) return;
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = window.jsQR?.(imageData.data, canvas.width, canvas.height);
                if (code) {
                  handleDecodedText(code.data, 'QR');
                  return;
                }
                requestAnimationFrame(tick);
              };
              requestAnimationFrame(tick);
            } catch (cameraError) {
              close();
              showToast('Camera access failed. Allow camera access and try again.');
              console.error('BatchTrack scanner failed:', cameraError);
            }
          }
        }

        async function generateQrPdf(items, retailer) {
          if (!window.jspdf || !window.QRCode || !window.bwipjs) {
            showToast('QR / Aztec / PDF libraries did not load.');
            return;
          }
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
          const pageWidth = pdf.internal.pageSize.getWidth();
          const safeX = 12;
          const itemWidth = 58;
          const itemHeight = 52;
          let x = 14;
          let y = 18;

          for (let i = 0; i < items.length; i += 1) {
            const item = items[i];
            const qrDataUrl = await QRCode.toDataURL(qrPayload(item), { width: 240, margin: 1 });
            const aztecCanvas = document.createElement('canvas');
            bwipjs.toCanvas(aztecCanvas, { bcid: 'azteccode', text: aztecPayload(item), scale: 3, padding: 2, includetext: false });
            const aztecDataUrl = aztecCanvas.toDataURL('image/png');

            pdf.addImage(aztecDataUrl, 'PNG', x, y, 25, 25);
            pdf.addImage(qrDataUrl, 'PNG', x + 27, y, 25, 25);
            pdf.setFontSize(8);
            pdf.setTextColor(17, 32, 51);
            pdf.text('AZTEC', x + 12.5, y + 29, { align: 'center' });
            pdf.text('QR', x + 39.5, y + 29, { align: 'center' });
            pdf.setFontSize(7);
            pdf.text(`WADN: ${(item.wadn || '').slice(0, 18)}`, x, y + 36, { maxWidth: 54 });
            pdf.text(`Category: ${normalizeCategory(item.category)}`, x, y + 41, { maxWidth: 54 });
            pdf.text(`Batch: ${(item.batchNumber || '').slice(0, 16)}`, x, y + 46, { maxWidth: 54 });
            pdf.text(`Expiry: ${item.expiry || '—'}`, x, y + 51, { maxWidth: 54 });

            if ((i + 1) % 4 === 0) {
              x = 14;
              y += 56;
              if (y > 180) {
                pdf.addPage();
                x = 14;
                y = 18;
              }
            } else {
              x += itemWidth + 6;
              if (x > pageWidth - 32) {
                x = 14;
                y += 56;
                if (y > 180) {
                  pdf.addPage();
                  x = 14;
                  y = 18;
                }
              }
            }
          }

          pdf.save(`qr-grid-${retailer.storeName || 'inventory'}.pdf`);
        }

          document.getElementById('machine-cash')?.addEventListener('input', () => {
            const total = (window.__machineCart || []).reduce((sum, item) => sum + Number(item.total || 0), 0);
            const cash = Number(document.getElementById('machine-cash').value || 0);
            document.getElementById('machine-shortage').value = Math.max(0, cash - total).toFixed(2);
          });
          document.getElementById('log-change-debt')?.addEventListener('click', () => {
            const total = (window.__machineCart || []).reduce((sum, item) => sum + Number(item.total || 0), 0);
            const cash = Number(document.getElementById('machine-cash').value || 0);
            const shortage = Math.max(0, cash - total);
            if (!document.getElementById('machine-phone').value.trim() || !shortage) {
              showToast('Enter the customer phone and cash received above the total.');
              return;
            }
            window.__machineDebtRequested = true;
            showToast(`₹${formatCurrency(shortage)} change debt will be logged with this sale.`);
          });

          document.getElementById('add-machine-item')?.addEventListener('click', () => {
            const phone = document.getElementById('machine-phone').value.trim();
            const batch = document.getElementById('machine-batch').value.trim();
            const qty = Number(document.getElementById('machine-qty').value || 1);
            const price = Number(document.getElementById('machine-price').value || 0);
            const category = normalizeCategory(document.getElementById('machine-category').value);
            const wadn = document.getElementById('machine-wadn').value.trim() || `WADN-${batch}-${Date.now()}`;
            if (!phone || !batch || !qty || !price) {
              showToast('Complete consumer phone, batch and price.');
              return;
            }
            const inventoryItem = state.inventory.find((item) => item.retailerId === retailer.id && (item.batchNumber === batch || item.wadn === wadn));
            const entry = { batch, batchNumber: batch, wadn, category, warrantyMonths: Number(inventoryItem?.warrantyMonths || 0), expiry: inventoryItem?.expiry || '', qty, price, total: qty * price };
            window.__machineCart.push(entry);
            document.getElementById('machine-batch').value = '';
            document.getElementById('machine-wadn').value = '';
            document.getElementById('machine-qty').value = 1;
            document.getElementById('machine-price').value = 0;
            renderMachineCart();
          });

          document.getElementById('submit-machine-sale')?.addEventListener('click', async () => {
            const phone = document.getElementById('machine-phone').value.trim();
            if (!phone || !window.__machineCart.length) { showToast('Add at least one item and a consumer phone.'); return; }
            const consumer = state.consumers.find((item) => item.phone === phone);
            if (!consumer) { showToast('Consumer account not found for this phone number.'); return; }
            const retailer = state.retailers.find((item) => item.id === machine.retailerId);
            const total = window.__machineCart.reduce((sum, item) => sum + Number(item.total || 0), 0);
            const cashReceived = Number(document.getElementById('machine-cash').value || 0);
            const appliedCredit = window.__machineAppliedCredits.reduce((sum, note) => sum + Number(note.amount || 0), 0);
            const netPayable = Math.max(0, total - appliedCredit);
            const shortage = Math.max(0, cashReceived - netPayable);
            const amountPaid = Math.min(netPayable, cashReceived);
            const rewardPct = Number(retailer?.rewards?.percentage || 4);
            const fixedCredit = Number(retailer?.rewards?.fixedCredit || 25);
            const creditAmount = Math.max(0, total * (rewardPct / 100) + fixedCredit);
            const transaction = {
              id: uid(),
              retailerId: retailer.id,
              retailerName: retailer.storeName || retailer.name,
              consumerPhone: phone,
              machineId: machine.id,
              totalAmount: total,
              amountPaid,
              cashReceived,
              changeDebtOwed: shortage,
              changeDebtRequested: window.__machineDebtRequested,
              creditApplied: appliedCredit,
              creditAmount,
              items: window.__machineCart,
              createdAt: new Date().toISOString()
            };
            await writeTable('transactions', transaction);
            if (shortage > 0) {
              await writeTable('credit_notes', { id: uid(), retailerId: retailer.id, retailerName: retailer.storeName || retailer.name, consumerPhone: phone, amount: shortage, status: 'active', transactionId: transaction.id, createdAt: transaction.createdAt });
            }
            for (const note of window.__machineAppliedCredits) {
              note.status = 'redeemed';
              note.redeemedAt = transaction.createdAt;
              note.redeemedTransactionId = transaction.id;
              await writeTable('credit_notes', note);
            }
            for (const soldItem of window.__machineCart) {
              const inventoryItem = state.inventory.find((item) => item.retailerId === retailer.id && (item.batchNumber === soldItem.batchNumber || item.wadn === soldItem.wadn));
              if (inventoryItem) {
                inventoryItem.quantity = Math.max(0, Number(inventoryItem.quantity || 0) - Number(soldItem.qty || 0));
                await writeTable('inventory', inventoryItem);
              }
            }
            await writeTable('documents', {
              id: `DOC-${transaction.id}`,
              documentType: 'tax-invoice',
              documentId: `DOC-${transaction.id}`,
              retailerId: retailer.id,
              storeName: retailer.storeName || retailer.name,
              customerPhone: phone,
              itemList: window.__machineCart,
              amountPaid,
              changeDebtOwed: shortage,
              radDossiers: window.__machineCart.map((item) => ({ wadn: item.wadn, category: item.category, batchNumber: item.batchNumber, purchaseDate: transaction.createdAt, warrantyExpires: warrantyExpiry(item, new Date(transaction.createdAt)), verificationStatus: 'RAD-Verified' })),
              createdAt: transaction.createdAt
            });
            consumer.credits = Number(consumer.credits || 0) + Number(creditAmount || 0);
            consumer.purchases = Array.isArray(consumer.purchases) ? consumer.purchases : [];
            consumer.purchases.push({
              id: uid(),
              createdAt: transaction.createdAt,
              retailerName: retailer.storeName || retailer.name,
              totalAmount: total,
              creditAmount,
              items: window.__machineCart
            });
            await writeTable('consumers', consumer);
            await loadAllData();
            showToast(`Sale saved. Credit added: ₹${formatCurrency(creditAmount)} to ${consumer.name}.`);
            window.__machineCart = [];
            renderMachineDashboard(machine);
          });

          document.querySelector('[data-action="logout"]')?.addEventListener('click', () => { state.session = null; saveSession(null); renderLanding(); });
        }

        function renderMachineCart() {
          const cartNode = document.getElementById('machine-cart');
          const total = (window.__machineCart || []).reduce((sum, item) => sum + Number(item.total || 0), 0);
          const totalNode = document.getElementById('machine-total');
          if (totalNode) totalNode.textContent = `₹${formatCurrency(total)}`;
          if (!cartNode) return;
          cartNode.innerHTML = (window.__machineCart || []).length ? (window.__machineCart || []).map((item) => `
            <div class="row-item">
              <div>
                <div style="font-weight:800;">${escapeHtml(item.batch)}</div>
                <div class="tiny">Qty ${item.qty} • ₹${formatCurrency(item.price)}</div>
              </div>
              <div class="pill green">₹${formatCurrency(item.total)}</div>
            </div>
          `).join('') : '<div class="tiny">Cart is empty.</div>';
        }

        function escapeHtml(value) {
          return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
        }

        function initials(value) {
          return (String(value || 'B').split(/\s+/).map((part) => part[0]).join('').slice(0, 2) || 'B').toUpperCase();
        }

        function formatCurrency(value) {
          const num = Number(value || 0);
          return Number(num).toLocaleString('en-IN', { maximumFractionDigits: 2 });
        }

        function attachGlobalEvents() {
          document.addEventListener('click', async (event) => {
            const target = event.target.closest ? event.target.closest('[data-mode-toggle], [data-action]') : event.target;
            if (target?.matches?.('[data-mode-toggle]')) {
              toggleViewMode();
              return;
            }
            const action = target?.dataset?.action;
            if (!action) return;
            if (action === 'home') renderLanding();
            if (action === 'logout') { state.session = null; saveSession(null); renderLanding(); }
            if (action === 'retail-home') renderDashboard('overview');
            if (action === 'retail-inventory') renderDashboard('inventory');
            if (action === 'retail-profile') renderDashboard('profile');
            if (action === 'retail-billing') renderDashboard('billing');
            if (action === 'retail-tickets') renderDashboard('tickets');
            if (action === 'consumer-home') renderDashboard();
            if (action === 'consumer-scan') await startQrScanner();
          });
        }

        async function bootstrap() {
          applyViewMode();
          try {
            await window.batchTrackConfigReady;
            await loadAllData();
            state.session = getSession();
            attachGlobalEvents();
            if (state.session) {
              renderDashboard();
            } else {
              renderLanding();
            }
          } catch (error) {
            appNode.innerHTML = `
              <div class="app-shell">
                <div class="auth-shell">
                  <div class="eyebrow">Supabase unavailable</div>
                  <h1>Storage could not be opened.</h1>
                  <p class="sub">BatchTrack could not connect to Supabase. Check the deployment environment variables and network connection, then try again.</p>
                  <button class="btn primary" type="button" onclick="location.reload()">Try again</button>
                </div>
              </div>
            `;
            console.error('BatchTrack database startup failed:', error);
          }
        }

        bootstrap();
      })();
    </script>
  </body>
</html>
